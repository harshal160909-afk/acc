# Netlify deployment for ACC.
#
# ACC runs its `vinext` build (a Worker-style handler) inside a Netlify
# Function, backed by a libSQL/Turso database instead of Cloudflare D1. Static
# assets are served from the build's client output; everything else (the SSR
# page and every /api/* route) is handled by the server function.

[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Bundle the built server and its dependencies with the function.
  node_bundler = "esbuild"
  included_files = ["dist/server/**"]

# Long-cache the content-hashed client assets (mirrors dist/client/_headers).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Financial API responses must never be cached by the CDN.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# The server function (netlify/functions/server.mjs) declares `path = "/*"` with
# preferStatic, so real files in dist/client are served directly and all other
# requests fall through to the app. No extra redirects are required.
